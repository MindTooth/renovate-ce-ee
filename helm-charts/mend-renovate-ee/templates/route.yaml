{{- if .Values.route.enabled -}}
{{- $fullName := include "mend-renovate.fullname" . -}}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "mend-renovate.name" . }}
    helm.sh/chart: {{ include "mend-renovate.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  {{- with .Values.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.route.host }}
  host: {{ . | quote }}
  {{- end }}
  to:
    kind: Service
    name: {{ $fullName }}-svc-server
  port:
    targetPort: {{ .Values.route.targetPort | quote }}
  {{- with .Values.route.tls }}
  {{- if ne .termination "edge" }}
  {{- fail "route.tls.termination must be edge; use tls: null for an HTTP-only Route" }}
  {{- end }}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: {{ .insecureEdgeTerminationPolicy | quote }}
  {{- end }}
{{- end }}
